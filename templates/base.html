{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            {% block title %}CRM{% endblock %}
        </title>
        <link rel="stylesheet"  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
    </head>
    <body>
        <header class="container-head">
            <img src="{% static 'homepage/img/logo.png' %}" alt="CRM" class="crm-logo">
            {% include "includes/navigation.html" %}
        </header>
        <main>
            {% block content %}
            {% endblock %}
        </main>
         <footer class="container mt-4 mb-3">
        <p>
            &copy; <span id="current-year"></span> CRM
        </p>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
    </body>
</html>
