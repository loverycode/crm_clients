<article class="card client-card mb-3">
    <div class="card-body">
        <h2 class="card-title">
            {{ client.name|default:"Без названия" }}
        </h2>

        <p class="card-text">
            Статус: {{ client.status }}
        </p>

       <a href="{{ client.get_absolute_url }}" class="btn btn-primary">Подробнее</a>
    </div>
</article>
