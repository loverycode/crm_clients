<article class="card client-card mb-3">
    <div class="card-body">
        <h2 class="card-title">
            {{ client.name|default:"Без названия" }}
        </h2>

        <p class="card-text">
            Статус: {{ client.status }}
        </p>

        <a
            href="{% url 'clients:detail' client.id %}"
            class="btn btn-primary"
        >
            Подробнее
        </a>
    </div>
</article>
