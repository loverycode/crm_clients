{% extends "base.html" %}

{% block title %}
    Клиенты – CRM
{% endblock %}

{% block content %}
    <h1>Клиенты</h1>

    <p>
        Всего клиентов: {{ clients|length }}
    </p>

    {% for client in clients %}
        {% include "clients/includes/client_card.html" %}
    {% empty %}
        <p>Клиенты не найдены.</p>
    {% endfor %}
{% endblock %}
